name: Short diario

on:
  # Los horarios (7:15, 13:15 y 19:15 Bogotá) los dispara Google Apps Script con workflow_dispatch.
  # El cron de GitHub se quitó: fallaba y, cuando por fin corrió, duplicaba los Shorts.
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano
    inputs:
      solo_verificar_youtube:
        description: "Solo verificar las conexiones (YouTube, Facebook, TikTok); no genera video"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: short-diario
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Caché de la voz
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en-us-ryan-high-v1

      - name: Descargar la voz (solo la primera vez)
        run: |
          if [ ! -f voices/en-us-ryan-high.onnx ]; then
            mkdir -p voices && cd voices
            curl -sSL -o voz.tar.gz https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-ryan-high.tar.gz
            tar xzf voz.tar.gz && rm voz.tar.gz
          fi

      - name: Caché de la voz Kokoro
        uses: actions/cache@v4
        with:
          path: voices/kokoro
          key: kokoro-v1.0-int8

      - name: Descargar Kokoro (solo la primera vez)
        run: |
          mkdir -p voices/kokoro && cd voices/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f kokoro-v1.0.int8.onnx ] || curl -sSfL -o kokoro-v1.0.int8.onnx $B/kokoro-v1.0.int8.onnx
          [ -f voices-v1.0.bin ] || curl -sSfL -o voices-v1.0.bin $B/voices-v1.0.bin

      - name: Verificar conexión con YouTube
        if: ${{ inputs.solo_verificar_youtube }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
        run: |
          python scripts/youtube.py --verificar || true
          python scripts/facebook.py --verificar || true
          python scripts/tiktok.py --verificar || true

      - name: Generar el Short, subirlo y enviarlo a Telegram
        if: ${{ !inputs.solo_verificar_youtube }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
        run: python scripts/daily.py

      - name: Guardar el video en la rama previews (para subirlo a YouTube/TikTok desde el navegador)
        if: ${{ !inputs.solo_verificar_youtube }}
        run: |
          git config user.name "white-hole-bot"
          git config user.email "white-hole-bot@users.noreply.github.com"
          n=$(cat out/ultimo.txt 2>/dev/null || true); [ -n "$n" ] || { n=$(ls -t guiones/publicados | head -1); n=${n%.json}; }
          cp out/short.mp4 /tmp/$n.mp4; cp guiones/publicados/$n.json /tmp/$n.json
          git stash -q -u || true
          git fetch -q origin previews && git checkout -q previews
          mkdir -p diarios && cp /tmp/$n.mp4 /tmp/$n.json diarios/
          ls -t diarios/*.mp4 | tail -n +16 | xargs -r git rm -q
          git add diarios && git commit -qm "Short diario $n" && git push -q origin previews
          git checkout -q main && git stash pop -q || true

      - name: Guardar el progreso de la cola
        if: ${{ !inputs.solo_verificar_youtube }}
        run: |
          git config user.name "white-hole-bot"
          git config user.email "white-hole-bot@users.noreply.github.com"
          git add guiones
          git diff --cached --quiet || git commit -m "Short enviado: $(date -u +%F %H:%M)"
          git pull --rebase -q origin main && git push
