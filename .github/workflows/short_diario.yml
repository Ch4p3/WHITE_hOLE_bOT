name: Short diario

on:
  schedule:                  # 3 Shorts al día (hora Colombia = UTC-5)
    - cron: "23 12 * * *"   # 7:23 a. m.
    - cron: "23 18 * * *"   # 1:23 p. m.
    - cron: "23 0 * * *"    # 7:23 p. m.
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano
    inputs:
      solo_verificar_youtube:
        description: "Solo verificar la conexión con YouTube (no genera video)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: short-diario
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Caché de la voz
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en-us-ryan-high-v1

      - name: Descargar la voz (solo la primera vez)
        run: |
          if [ ! -f voices/en-us-ryan-high.onnx ]; then
            mkdir -p voices && cd voices
            curl -sSL -o voz.tar.gz https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-ryan-high.tar.gz
            tar xzf voz.tar.gz && rm voz.tar.gz
          fi

      - name: Verificar conexión con YouTube
        if: ${{ inputs.solo_verificar_youtube }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/youtube.py --verificar

      - name: Generar el Short, subirlo y enviarlo a Telegram
        if: ${{ !inputs.solo_verificar_youtube }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/daily.py

      - name: Guardar el progreso de la cola
        if: ${{ !inputs.solo_verificar_youtube }}
        run: |
          git config user.name "white-hole-bot"
          git config user.email "white-hole-bot@users.noreply.github.com"
          git add guiones
          git diff --cached --quiet || git commit -m "Short enviado: $(date -u +%F %H:%M)"
          git pull --rebase -q origin main && git push
