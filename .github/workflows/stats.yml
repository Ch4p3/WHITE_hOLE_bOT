name: Estadisticas

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"     # cada 3 horas, para el panel

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Recoger estadisticas
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/stats.py
      - name: Guardar en previews
        run: |
          git config user.name "white-hole-bot"
          git config user.email "bot@users.noreply.github.com"
          cp out/stats.json /tmp/stats.json
          git fetch origin previews
          git checkout previews
          mkdir -p stats
          cp /tmp/stats.json "stats/$(date -u +%Y-%m-%d_%H%M).json"
          cp /tmp/stats.json stats/ultimo.json
          python3 - <<'PY'
          import json, os
          d = json.load(open("stats/ultimo.json"))
          def s(lst, *ks):
              t = 0
              for v in lst:
                  x = v
                  for k in ks: x = (x or {}).get(k) if isinstance(x, dict) else None
                  t += x or 0
              return t
          snap = {"t": d["generado"],
                  "yt_vistas": sum(v.get("vistas", 0) for v in d["youtube"]),
                  "yt_subs": int((d.get("youtube_canal") or {}).get("subscriberCount", 0) or 0),
                  "fb_vistas": s(d["facebook"], "metricas", "fb_reels_total_plays") or s(d["facebook"], "metricas", "total_video_views"),
                  "fb_likes": s(d["facebook"], "likes"), "fb_seg": (d.get("facebook_pagina") or {}).get("followers_count") or 0,
                  "ig_vistas": s(d["instagram"], "metricas", "views"), "ig_likes": s(d["instagram"], "likes"),
                  "ig_seg": (d.get("instagram_cuenta") or {}).get("followers_count") or 0}
          h = json.load(open("stats/historial.json")) if os.path.exists("stats/historial.json") else []
          h.append(snap); json.dump(h[-400:], open("stats/historial.json", "w"))
          PY
          ls -t stats/2*.json | tail -n +30 | xargs -r git rm -q
          git add stats
          git commit -m "Estadisticas $(date -u +%F)" && git push origin previews
